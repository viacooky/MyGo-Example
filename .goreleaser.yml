version: 2

builds:
  - skip: true

archives:
  - format: binary
    name_template: "MyGo-Example-Setup_{{ .Version }}_Windows_x86_64.exe"
    files:
      # 精确匹配 dist/windows-amd64 下的 setup 文件
      - dist/windows-amd64/*-setup-*-amd64.exe

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*feat[(:/]'
      order: 0
    - title: Bug fixes
      regexp: '^.*fix[(:/]'
      order: 1
    - title: Refactors
      regexp: '^.*refactor[(:/]'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "(?i)wip"
      - "(?i)\\binit\\b"
      - "^merge "

release:
  draft: false
  prerelease: auto
  extra_files:
    - glob: dist/windows-amd64/*-setup-*-amd64.exe