name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
      
      - name: Update version in mygo.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION in mygo.json"
          
          jq --arg v "$VERSION" '.version = $v' mygo.json > tmp.json && mv tmp.json mygo.json
          
          echo "mygo.json 当前版本: $(jq -r '.version' mygo.json)"

      # 只构建 Windows 产物
      - name: Build with MyGo
        run: |
          go tool mygo build -platform windows/amd64

      - name: Create Release with Auto Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            dist/windows-amd64/*-setup-*-amd64.exe